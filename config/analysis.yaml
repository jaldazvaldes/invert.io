# Análisis experimental: solo datos públicos y oportunidades hipotéticas, sin órdenes.
venue: revolutx
region: EEA
quote: EUR
timeframe: 1m
interval_seconds: 60
selection_seconds: 300
market_scope: top # --all-markets amplía a todos los EUR usando consultas autenticadas
max_markets: 20
max_spread_pct: 0.3
max_slippage_pct: 0.1
reference_eur: 100.0
taker_fee_pct: 0.09
quote_max_age_seconds: 60
bar_max_age_seconds: 120
lifetime_minutes: 240
entry_score: 70.0
exit_score: 40.0
stop_atr: 2.0
target_atr: 3.0
score_params:
  min_atr_pct: 0
