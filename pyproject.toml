[project]
name = "invertio"
version = "0.1.0"
description = "App personal de trading por señales (cripto + acciones)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "ccxt>=4.5.84",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
invertio = "invertio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invertio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Los textos de la app están en español: se permiten caracteres como «á» o «€».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas por Alembic.
"src/invertio/persistence/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["alembic.*", "ccxt", "ccxt.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
